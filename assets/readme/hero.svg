<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">TRA 倒计时 — 电影级 3D 倒计时与字母逐字变形</title>
  <desc id="desc">深色电影底标题：TRA 倒计时；右侧是圆角 3D 方块拼成的字母 T，下方是倒计时 05:00。</desc>

  <rect width="1200" height="360" rx="26" fill="#050608"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#f59e0b">电影级 3D 倒计时 · CINEMATIC COUNTDOWN</text>
    <text x="56" y="128" font-size="62" font-weight="700" fill="#f8fafc">TRA 倒计时</text>
    <text x="56" y="168" font-size="23" fill="#e2e8f0">84 个 3D 方块，拼出时间和字母</text>
    <text x="56" y="204" font-size="19" fill="#94a3b8">倒计时模式 + A–Z 字母逐字变形，舞台感拉满。</text>
    <g id="chips" font-size="18" fill="#e2e8f0" text-anchor="middle">
      <g><rect x="56" y="238" width="132" height="36" rx="18" fill="#171a20" stroke="#2a2f3a" stroke-width="1.5"/><text x="122" y="262">84 个 3D 方块</text></g>
      <g><rect x="200" y="238" width="104" height="36" rx="18" fill="#171a20" stroke="#2a2f3a" stroke-width="1.5"/><text x="252" y="262">倒计时</text></g>
      <g><rect x="316" y="238" width="118" height="36" rx="18" fill="#171a20" stroke="#2a2f3a" stroke-width="1.5"/><text x="375" y="262">A–Z 字母</text></g>
      <g><rect x="446" y="238" width="118" height="36" rx="18" fill="#171a20" stroke="#2a2f3a" stroke-width="1.5"/><text x="505" y="262">完成音效</text></g>
    </g>
  </g>

  <g id="block-letter">
    <g id="blocks" fill="#e8edf2">
      <rect x="836" y="56" width="34" height="34" rx="8"/><rect x="878" y="56" width="34" height="34" rx="8"/><rect x="920" y="56" width="34" height="34" rx="8"/><rect x="962" y="56" width="34" height="34" rx="8"/><rect x="1004" y="56" width="34" height="34" rx="8"/>
      <rect x="899" y="98" width="34" height="34" rx="8"/><rect x="941" y="98" width="34" height="34" rx="8"/>
      <rect x="899" y="140" width="34" height="34" rx="8"/><rect x="941" y="140" width="34" height="34" rx="8"/>
      <rect x="899" y="182" width="34" height="34" rx="8"/><rect x="941" y="182" width="34" height="34" rx="8"/>
      <rect x="899" y="224" width="34" height="34" rx="8"/><rect x="941" y="224" width="34" height="34" rx="8"/>
    </g>
    <g id="particles" fill="#78b8e8">
      <circle cx="820" cy="70" r="2"/><circle cx="1060" cy="90" r="2"/><circle cx="1050" cy="240" r="2"/><circle cx="830" cy="250" r="2"/><circle cx="1090" cy="160" r="1.8"/><circle cx="800" cy="160" r="1.8"/>
    </g>
    <g id="count-label" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
      <text x="937" y="312" font-size="30" font-weight="700" fill="#f8fafc" text-anchor="middle">05:00</text>
      <text x="937" y="340" font-size="18" fill="#94a3b8" text-anchor="middle">T · R · A</text>
    </g>
  </g>
</svg>
